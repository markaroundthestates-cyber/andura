<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090b13" />
  <meta name="description" content="Andura - coach AI personal pentru sala, facut in Romania. Antrenament cu cap." />
  <meta name="color-scheme" content="dark light" />
  <!-- §4-C3 + §4-C4 + §4-C27/28/29 + §4-C17/23 audit fix: defense-in-depth headers.
       GH Pages has no custom HTTP headers → meta http-equiv where applicable.
       'unsafe-inline' tolerated initial (Tailwind injects style) — Track 7 nonce migration. -->
  <!-- Note: 'frame-ancestors' + X-Frame-Options are intentionally omitted — both
       directives are ignored when delivered via <meta> (browsers log console errors).
       True clickjacking protection requires HTTP headers, which GH Pages cannot set.
       Accepted-risk pre-Beta; revisit when migrating to a host that supports custom headers. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.firebaseio.com https://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://*.sentry.io https://o4511269200068608.ingest.de.sentry.io; base-uri 'self'; form-action 'self'" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!-- PWA manifest auto-injected by vite-plugin-pwa as /manifest.webmanifest.
       Single SoT: vite.config.js `VitePWA({manifest:...})`. -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  <!-- §15-N2 audit fix (NIT chat 5 Wave 22) — iOS Safari PWA hints. Without
       these, "Add to Home Screen" on iPhone opens app in regular Safari shell
       (URL bar + bottom toolbar visible) instead of standalone PWA mode.
       'apple-mobile-web-app-capable' enables standalone display on iOS,
       'apple-mobile-web-app-status-bar-style=default' surfaces light status
       bar matching cream paper background (#faf7f1). Maria 65 iPhone install
       flow now matches Android Add-to-Home parity. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Andura" />
  <!-- §36-M3 audit fix — DNS prefetch hints for Firebase + Sentry endpoints.
       Shaves initial connect time on first auth + telemetry calls (~50-100ms
       on cold cache). Google Fonts preconnect removed post self-host (2026-05-23). -->
  <link rel="dns-prefetch" href="//fittracker-c34e8-default-rtdb.europe-west1.firebasedatabase.app" />
  <link rel="dns-prefetch" href="//identitytoolkit.googleapis.com" />
  <link rel="dns-prefetch" href="//securetoken.googleapis.com" />
  <link rel="dns-prefetch" href="//o4511269200068608.ingest.de.sentry.io" />
  <link rel="preconnect" href="https://o4511269200068608.ingest.de.sentry.io" crossorigin />
  <!-- Boot shell (2026-11-16 perf pass): nothing painted until main.js (~320 KB gzip)
       downloaded + ran — Lighthouse mobile FCP 4.4 s on a blank page. The shell paints
       the app background + wordmark from the HTML alone; React's first render replaces
       it. The theme is resolved here exactly like themeSync.applyInitialTheme (stored
       wv2-settings-store theme, 'auto' → OS, default dark) so there is no flash. -->
  <script>
    (function () {
      var t = 'dark';
      try {
        var s = JSON.parse(localStorage.getItem('wv2-settings-store') || 'null');
        var v = s && s.state && s.state.theme;
        if (v === 'light' || v === 'dark') t = v;
        else if (v === 'auto') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) { /* default dark */ }
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    html { background: #090b13; }
    html[data-theme="light"] { background: #eef0f6; }
    #boot-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font: 700 28px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.02em; color: #f3f5fc; }
    html[data-theme="light"] #boot-shell { color: #0a0c14; }
  </style>
  <!-- LOCK V1 D061 — font self-host Latin subset 344→48KB (DECISIONS.md §D061).
       Self-host Inter Variable Latin subset @font-face declared in
       src/styles/global.css (font-display: swap). Bundled via Vite from
       @fontsource-variable/inter (Latin slice ~48 KB). Preload omis post
       chat 5 FONT_SUBSET_LATIN_FIX — hash dynamic + global.css critical
       CSS path already discovers @font-face declaration pre-paint.
       CSP font-src 'self' tighten ZERO Google Fonts dependency (line above). -->
  <title>Andura</title>
  <!-- SPA GitHub Pages redirect decode (Rafael Pedicini pattern spa-github-pages).
       Pereche cu public/404.html: 404.html encode URL → query string,
       acest script decode + history.replaceState înainte React Router mount.
       Critical pentru Magic Link callback /auth-callback?oobCode=XXX (Firebase). -->
  <script type="text/javascript">
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <style>
    /* Andura Pulse FOUC shell (2026-05-29) — matches the DEFAULT Pulse-dark
       --paper #090b13 / --ink #f3f5fc so the pre-hydration paint matches the
       common case (dark is the CEO default; a persisted light-mode user
       re-skins on hydrate via applyInitialTheme + global.css). Manrope/Inter
       system fallback (Pulse fonts load via @fontsource @font-face in
       global.css, font-display: swap). */
    html, body {
      margin: 0;
      padding: 0;
      background: #090b13;
      color: #f3f5fc;
      font-family: 'Manrope Variable', 'Inter', system-ui, sans-serif;
      min-height: 100vh;
    }
    #root {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root"><div id="boot-shell" aria-hidden="true">Andura</div></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
